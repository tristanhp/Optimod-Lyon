name: Diagrammes

# Régénère les images de docs/diagrams/out/ quand un diagramme change, et les
# pousse sur la branche de la PR pour qu'elles arrivent avec elle.
on:
  pull_request:
    paths:
      - "docs/diagrams/*.puml"
      - "scripts/render-diagrams.sh"
      - ".github/workflows/diagrams.yml"

concurrency:
  group: diagrams-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  render:
    name: Régénérer les images
    # Pas de push possible vers un fork : le check "À jour" de la CI s'en charge.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      HEAD_REF: ${{ github.head_ref }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "27"

      - name: Installer Graphviz
        run: sudo apt-get install -y --no-install-recommends graphviz >/dev/null

      - name: Rendre les diagrammes
        run: ./scripts/render-diagrams.sh

      - name: Committer les images si elles ont changé
        id: commit
        run: |
          git add docs/diagrams/out
          if git diff --cached --quiet; then
            echo "Images déjà à jour."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: regenerate diagrams"
          git push origin "HEAD:$HEAD_REF"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Un push fait avec GITHUB_TOKEN ne déclenche aucun workflow : sans cela, le
      # check requis "CI OK" n'existerait pas sur le dernier commit de la PR.
      - name: Relancer la CI sur le nouveau commit
        if: steps.commit.outputs.pushed == 'true'
        run: gh workflow run ci.yml --ref "$HEAD_REF"
