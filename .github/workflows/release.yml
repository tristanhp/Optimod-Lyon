name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "27"
          cache: maven

      - name: Aligner la version Maven sur le tag
        run: mvn -B -ntp versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - name: Build et tests
        run: mvn -B -ntp clean verify

      - name: Publier la release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            target/optimod-lyon-*.jar
            !target/original-*.jar
