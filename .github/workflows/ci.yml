name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "27"
  MAVEN_ARGS: "-B -ntp"

jobs:
  build:
    name: Build, tests et couverture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Tests + couverture (mvn clean verify)
        run: mvn $MAVEN_ARGS clean verify

      - name: Javadoc
        run: mvn $MAVEN_ARGS javadoc:javadoc

      - name: Smoke test du jar exécutable
        run: java -jar "$(ls target/optimod-lyon-*.jar | grep -v '^target/original-' | head -n 1)"

      - name: Résumé de la couverture
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 { m+=$8; c+=$9 } END {
              t=m+c; p=(t>0)?100*c/t:0;
              printf "### Couverture JaCoCo\n\nLignes couvertes : **%d / %d** (%.1f %%)\n", c, t, p
            }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rapports-build
          path: |
            target/site/jacoco
            target/surefire-reports
            target/reports/apidocs
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: jar-executable
          path: |
            target/optimod-lyon-*.jar
            !target/original-*.jar

  build-jdk-lts:
    name: Compatibilité JDK 25 (LTS, informatif)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build avec release 25
        run: mvn $MAVEN_ARGS clean verify -Dmaven.compiler.release=25

  quality:
    name: Qualité (Checkstyle, SpotBugs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Checkstyle (avertissements non bloquants)
        run: mvn $MAVEN_ARGS checkstyle:check
      - name: SpotBugs
        run: mvn $MAVEN_ARGS compile spotbugs:check

  hygiene:
    name: Hygiène (EditorConfig, Markdown, liens, XML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: EditorConfig
        uses: editorconfig-checker/action-editorconfig-checker@v3.0.0
      - run: editorconfig-checker

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
            !node_modules
            !target

      - name: Vérification des liens
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 3 --accept 200,403,429
            --exclude-path target --exclude-path .git
            '**/*.md'
          fail: true

      - name: Fichiers XML bien formés
        run: |
          sudo apt-get install -y --no-install-recommends libxml2-utils >/dev/null
          shopt -s nullglob
          files=(src/main/resources/data/*.xml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Aucun XML dans src/main/resources/data/ : rien à valider."
          else
            xmllint --noout "${files[@]}"
          fi

  diagrams:
    name: Diagrammes PlantUML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Rendre les diagrammes
        run: ./scripts/render-diagrams.sh
      - name: Les images committées sont à jour
        run: |
          if [ -n "$(git status --porcelain docs/diagrams/out)" ]; then
            git status --short docs/diagrams/out
            echo "::error::docs/diagrams/out n'est pas à jour. Lance ./scripts/render-diagrams.sh et committe le résultat (sur une PR, le workflow Diagrammes le fait automatiquement)."
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: diagrammes
          path: docs/diagrams/out

  secrets:
    name: Détection de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Point d'entrée unique pour la branch protection : seul ce check est requis.
  ci-ok:
    name: CI OK
    if: always()
    needs: [build, quality, hygiene, diagrams, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier que tous les jobs requis ont réussi
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "Un job requis a échoué."
            exit 1
          fi
